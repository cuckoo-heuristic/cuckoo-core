<!DOCTYPE html>
<html>
<body>
<h2>WebSocket Test</h2>
<button onclick="connect()">Connect</button>
<pre id="log"></pre>

<script>
let socket;

function log(msg){
    document.getElementById("log").textContent += msg + "\n";
}

function connect() {
    socket = new WebSocket("ws://127.0.0.1:8000/ws/vehicle-status/1/");
    socket.onopen = () => log("OPENED");
    socket.onmessage = (event) => log("MESSAGE: " + event.data);
    socket.onerror = (err) => log("ERROR: " + err);
    socket.onclose = () => log("CLOSED");
}
</script>
</body>
</html>
